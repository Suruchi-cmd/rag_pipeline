services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_PG_USER:-ultimateadvisor}
      POSTGRES_PASSWORD: ${APP_PG_PASSWORD}
      POSTGRES_DB: ${APP_PG_DATABASE:-ultimateadvisor_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_PG_USER:-ultimateadvisor} -d ${APP_PG_DATABASE:-ultimateadvisor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_PG_HOST: db
      APP_PG_PORT: 5432
      APP_DEFAULT_OLLAMA_BASE_URL: http://host-gateway:11434
    extra_hosts:
      - "host-gateway:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:
